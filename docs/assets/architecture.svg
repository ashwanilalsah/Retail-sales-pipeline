<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">Retail Sales ETL Pipeline Architecture</title><desc id="desc">CSV input passes through extraction, validation and deduplication, normalization, and produces cleaned CSV and rejected JSON. Optional database loading is separate and disabled by default.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eaf2ff"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526581"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".10"/></filter></defs>
<rect width="1400" height="650" rx="26" fill="url(#bg)"/><text x="70" y="72" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" fill="#13233f">Retail Sales · End-to-End ETL</text><text x="70" y="108" font-family="Inter,Arial,sans-serif" font-size="17" fill="#526581">Local-first processing with explicit, opt-in database integration</text>
<g filter="url(#shadow)" font-family="Inter,Arial,sans-serif"><rect x="60" y="205" width="190" height="130" rx="18" fill="#ffffff" stroke="#b9c9e2" stroke-width="2"/><rect x="290" y="205" width="220" height="130" rx="18" fill="#e8f2ff" stroke="#80a9e8" stroke-width="2"/><rect x="550" y="205" width="250" height="130" rx="18" fill="#e9f8f0" stroke="#76c69b" stroke-width="2"/><rect x="840" y="205" width="220" height="130" rx="18" fill="#fff4df" stroke="#e5bd65" stroke-width="2"/><rect x="1100" y="150" width="240" height="105" rx="18" fill="#ffffff" stroke="#b9c9e2" stroke-width="2"/><rect x="1100" y="285" width="240" height="105" rx="18" fill="#ffffff" stroke="#b9c9e2" stroke-width="2"/></g>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="155" y="247" font-size="20" font-weight="700" fill="#13233f">CSV source</text><text x="155" y="278" font-size="15" fill="#526581">Sample or input folder</text><text x="155" y="301" font-size="13" fill="#526581">12-column contract</text><text x="400" y="247" font-size="20" font-weight="700" fill="#174a8b">Extract</text><text x="400" y="278" font-size="15" fill="#355b8c">Read CSV safely</text><text x="400" y="301" font-size="13" fill="#355b8c">File and header checks</text><text x="675" y="247" font-size="20" font-weight="700" fill="#17623b">Validate + deduplicate</text><text x="675" y="278" font-size="15" fill="#276749">Required fields, dates,</text><text x="675" y="300" font-size="15" fill="#276749">numeric rules, totals</text><text x="950" y="247" font-size="20" font-weight="700" fill="#85530a">Normalize</text><text x="950" y="278" font-size="15" fill="#85530a">Standardize accepted rows</text><text x="950" y="301" font-size="13" fill="#85530a">Run-specific outputs</text><text x="1220" y="190" font-size="19" font-weight="700" fill="#13233f">Cleaned CSV</text><text x="1220" y="219" font-size="14" fill="#526581">Accepted records</text><text x="1220" y="326" font-size="19" font-weight="700" fill="#13233f">Rejected JSON</text><text x="1220" y="355" font-size="14" fill="#526581">Source + reason codes</text></g>
<g stroke="#526581" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M250 270 H285"/><path d="M510 270 H545"/><path d="M800 270 H835"/><path d="M1060 250 H1080 V202 H1095"/><path d="M1060 290 H1080 V337 H1095"/></g>
<rect x="270" y="440" width="860" height="130" rx="20" fill="#f1f5f9" stroke="#a7b6c8" stroke-width="2" stroke-dasharray="8 7"/><text x="700" y="477" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">Optional database loader · separate opt-in path</text><text x="700" y="508" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#526581">Parameterized SQL · transaction / rollback · connection closed by loader</text><text x="700" y="536" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#a16207">Disabled by default; not invoked by the normal local CLI</text><path d="M700 335 V420" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 6" fill="none"/><text x="70" y="615" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">Illustrates code paths documented in this repository; database execution and cloud deployment are not implied.</text></svg>
